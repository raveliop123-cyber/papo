name: papo_app
description: "PAPO - Portefeuille Électronique & Écosystème de Services Financiers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & API
  pocketbase: ^0.18.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.2
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.2.0
  lottie: ^2.7.0
  
  # Authentification & Sécurité
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.0
  
  # Paiements Offline
  nfc_manager: ^3.4.0
  mobile_scanner: ^5.0.0
  flutter_blue_plus: ^1.32.0
  
  # Notifications
  firebase_messaging: ^14.8.0
  flutter_local_notifications: ^17.1.0
  
  # Utilitaires
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.0
  image_picker: ^1.0.0
  permission_handler: ^11.4.0
  
  # Charts & Graphs
  fl_chart: ^0.65.0
  
  # Networking
  http: ^1.1.0
  
  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  # Assets - À remplir avec les images, icônes et animations réelles
